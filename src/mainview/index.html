    <!-- boot-splash：在 React 挂载前同步设置主题背景色，避免首屏白闪（dark 模式下尤为明显） -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #09090b; }
    </style>
    <script>
      // next-themes 将主题明文串直接写入 localStorage["theme"]（如 "dark"/"system"/"light"），不做 JSON 编码
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
