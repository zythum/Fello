name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build + Publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            script: npm run release:mac:x64
          - os: macos-latest
            script: npm run release:mac:arm64
          - os: windows-latest
            script: npm run release:win
          - os: ubuntu-latest
            script: npm run release:linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build and publish (optional signing)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            echo "Code signing enabled"
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          else
            echo "Code signing disabled (CSC_LINK not set)"
          fi

          ${{ matrix.script }}
